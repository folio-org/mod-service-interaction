name: Build and integration tests

on:
  push:

jobs:
  integration-tests:
    name: Maven verify (unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and run the full test suite
        # Integration tests start their own Postgres via Testcontainers;
        # the module descriptor is validated by the pom-bound validator plugin.
        run: mvn -B verify
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IntegrationTestResults
          path: |
            target/surefire-reports/**/*.xml
            target/failsafe-reports/**/*.xml
          retention-days: 1

  boot-image:
    name: Build and boot the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Package the fat jar
        run: mvn -B -DskipTests package
      - name: Build the Docker image
        run: docker build -t mod-service-interaction:ci .
      - name: Boot the image and probe /admin/health
        run: |
          docker network create ci-net
          docker run -d --name ci-pg --network ci-net \
            -e POSTGRES_USER=folio_admin -e POSTGRES_PASSWORD=folio_admin -e POSTGRES_DB=okapi_modules \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec ci-pg pg_isready -U folio_admin -d okapi_modules && break
            sleep 2
          done
          docker run -d --name ci-mod --network ci-net -p 8080:8080 \
            -e DB_HOST=ci-pg -e DB_PORT=5432 \
            -e DB_USERNAME=folio_admin -e DB_PASSWORD=folio_admin -e DB_DATABASE=okapi_modules \
            mod-service-interaction:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/admin/health | grep -q '"status":"UP"'; then
              echo "Module answered UP on /admin/health"
              exit 0
            fi
            sleep 2
          done
          echo "Module failed to become healthy"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs ci-mod 2>&1 | tail -100 || true

  publish-test-results:
    if: always()
    needs: [integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          path: testLogs
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "testLogs/**/*.xml"
