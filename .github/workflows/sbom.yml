name: SBOM Generation

# Generates a CycloneDX SBOM for the Maven build at the repo root using Syft
# (anchore/sbom-action) and uploads it as a workflow artifact. The SBOM is
# no longer committed to the repo (see commit 9cb9d4f).

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build the fat jar
        run: mvn -B -DskipTests package
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: mod-service-interaction-cdx-bom.json
          upload-artifact: true
