apiVersion: apps/v1
kind: Deployment
metadata:
  name: $MOD_DEPLOY_AS
  labels:
    app: $MOD_DEPLOY_AS
    module: "mod-service-interaction"
    folio_role: "backend-module"
  namespace: "reshare"
spec:
  selector:
    matchLabels:
      app: $MOD_DEPLOY_AS
  replicas: 1
  template:
    metadata:
      labels:
        app: $MOD_DEPLOY_AS
        module: "mod-service-interaction"
        folio_role: "backend-module"
    spec:
      containers:
        - name: $MOD_DEPLOY_AS
          image: docker.libsdev.k-int.com/$MOD_IMAGE
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: folio-db-connect
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OKAPI_SERVICE_PORT
              value: "9130"
            - name: OKAPI_SERVICE_HOST
              value: "okapi"
            - name: JAVA_OPTIONS
              value: "-server -XX:+UseContainerSupport -XX:MaxRAMPercentage=55.0 -XX:+PrintFlagsFinal"
            - name: EVENTS_PUBLISHER_BOOTSTRAP_SERVERS
              value: "reshare-kafka-release:9092" 
            - name: EVENTS_CONSUMER_BOOTSTRAP_SERVERS
              value: "reshare-kafka-release:9092" 
            - name: EVENTS_PUBLISHER_ZK_CONNECT
              value: "reshare-zookeeper-release:2181" 
            - name: EVENTS_CONSUMER_ZK_CONNECT
              value: "reshare-zookeeper-release:2181"
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /admin/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /admin/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 768Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: $MOD_DEPLOY_AS
  namespace: "reshare"
spec:
  type: "ClusterIP"
  selector:
    app: $MOD_DEPLOY_AS
  ports:
    - port: 8080
      targetPort: 8080
---
# Attestation trust boundary (DP-3(a)): the module trusts the
# X-Okapi-User-Id header on /servint/attestation/token, so the module port
# must be reachable ONLY from the Okapi gateway. Direct module-port exposure
# voids the assertion trust — see the attestation trust-boundary ADR and the
# README security section.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: $MOD_DEPLOY_AS-okapi-only
  namespace: "reshare"
spec:
  podSelector:
    matchLabels:
      app: $MOD_DEPLOY_AS
  policyTypes:
    - Ingress
  ingress:
    - from:
        # PLACEHOLDER: replace with the label selector that identifies the
        # Okapi gateway pods in YOUR cluster (the value below matches a
        # deployment where Okapi pods carry app: okapi). Widening this
        # selector re-opens the trust boundary.
        - podSelector:
            matchLabels:
              app: okapi
      ports:
        - protocol: TCP
          port: 8080
