# Tenant reference-data seeding — corrected to the legacy module's real
# two-bucket trigger semantics (review finding F-06). Legacy seeds an
# unconditional @Defaults baseline at every enable (grails-okapi
# setDefaultsForTenant), while HousekeepingService's okapi:dataload:reference
# subscription (check-digit vocabulary + default generators) fires only for
# loadReference, and sample data (widget types) only for loadSample.

id: REQ-019
title: Reference data seeding
description: >
  When a tenant is enabled or upgraded, the module shall seed the
  @Defaults baseline unconditionally — the DashboardAccess.Access and
  NumberGeneratorSequence.MaximumCheck refdata vocabularies (two
  categories, six values), with no tenant parameters required — and shall
  seed the reference bucket (the NumberGeneratorSequence.CheckDigitAlgo
  vocabulary and the nine default number generators with their
  sequences) only when the loadReference tenant parameter carries the
  literal value "true", and shall import the widget types only when the
  loadSample tenant parameter carries the literal value "true"; all
  seeding shall be idempotent via lookupOrCreate and by-code matching, so
  repeat loads create nothing new, tenant-modified state is never
  overwritten, and a no-parameter enable yields exactly two categories,
  six values, zero generators, and zero widget types — matching the
  legacy baseline.

ears_pattern: event-driven
priority: high

refs:
  - specs/project/project.yaml#/goals/3

acceptance_criteria:
  - id: AC1
    text: >
      Every tenant enable or upgrade — with no tenant parameters required —
      seeds the DashboardAccess.Access category internal with the values
      manage, edit, and view (labels Manage, Edit, View) and the
      NumberGeneratorSequence.MaximumCheck category with below_threshold,
      over_threshold, and at_maximum; nothing else is seeded without
      parameters, so a no-parameter enable yields exactly two categories,
      six values, zero generators, and zero widget types.
  - id: AC2
    text: >
      When the tenant parameter loadReference carries the literal value
      "true", NumberGeneratorSequence.CheckDigitAlgo is additionally seeded
      with the seven algorithm values — none, ean13, 1793_ltr_mod10_r,
      12_ltr_mod10_r, isbn10checkdigit, issncheckdigit, luhncheckdigit —
      with their exact legacy labels; with loadReference absent or "false"
      the vocabulary is not seeded at enable time.
  - id: AC3
    text: >
      When loadReference carries the literal value "true", the nine
      default generators — openAccess, patronRequest, users_patronBarcode,
      organizations_vendorCode, inventory_accessionNumber,
      inventory_callNumber, inventory_itemBarcode,
      inventory_instanceIdentifier, serialsManagement_patternNumber — are
      seeded with their legacy sequences (codes, formats, templates,
      check-digit algorithms) and nextValue defaulting to 1; with
      loadReference absent or "false" no generators are seeded.
  - id: AC4
    text: >
      Seeding is idempotent across repeat enables and upgrades, including
      over adopted legacy schemas: refdata via lookupOrCreate, generators
      matched by code and sequences by owner + code, so no duplicates
      appear and tenant-modified rows (including advanced sequence
      nextValue) are left untouched.
  - id: AC5
    text: >
      When the tenant parameter loadSample carries the literal value
      "true", the widget types are imported; with loadSample absent or
      "false" no widget types are imported at enable time. The legacy
      sample-only test app-setting and custom-property rows are
      deliberately not ported (registered wire-compatibility deviation).
