id: TRC-020
title: Tenant lifecycle implementation
description: "folio-spring `_tenant` 2.0 lifecycle (ADR-012): enable/upgrade with the\
  \ legacy-identical schema name and the Liquibase master changelog chaining the adoption\
  \ baseline; purge via blank module_to + purge=true; disable via module_from-only\
  \ purge=false POST intercepted by ServintTenantController.postTenant and answered 204\
  \ through ServintTenantService.disableTenant with no Liquibase, no seeding, and\
  \ tenant-cache eviction (D-26); operation-status routes answered synchronously.\
  \ TenantEnableIT proves all five declared behaviors (enable 204 + schema, idempotent\
  \ repeat, GET/DELETE operation routes, side-effect-free disable via\
  \ okapiShapedDisableIsSideEffectFree, purge drop)."
spec_ref: specs/requirements/tenant-lifecycle.yaml#/id
