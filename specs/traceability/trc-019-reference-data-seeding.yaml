id: TRC-019
title: Reference data seeding implementation
description: "Two-bucket seeding per REQ-019: the @Defaults baseline (Access + MaximumCheck)\
  \ seeds unconditionally in afterTenantUpdate, the check-digit vocabulary and default\
  \ generators seed in the loadReferenceData override (loadReference=\"true\" only), and\
  \ widget types import in the loadSampleData override (loadSample=\"true\" only) —\
  \ the six-case enable matrix (params omitted/true/false, repeat enable, advanced\
  \ sequence survival) is pinned by TenantSeedingMatrixIT."
