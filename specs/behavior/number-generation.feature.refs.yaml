# Sidecar for number-generation.feature — every scenario is backed by the
# getNextNumber operation and traces to REQ-002/REQ-003 acceptance criteria.

source: specs/behavior/number-generation.feature
mappings:
  - element: "#/feature/Number generation/scenario/First number from an auto-created sequence"
    refs:
      - specs/api/servint-number-generators.yaml#/paths/~1servint~1numberGenerators~1getNextNumber/get
      - specs/requirements/numgen-generation.yaml#/acceptance_criteria/AC2
      - specs/requirements/numgen-generation.yaml#/acceptance_criteria/AC3
  - element: "#/feature/Number generation/scenario/Sequential numbers with prefix and default output template"
    refs:
      - specs/api/servint-number-generators.yaml#/paths/~1servint~1numberGenerators~1getNextNumber/get
      - specs/requirements/numgen-generation.yaml#/acceptance_criteria/AC4
